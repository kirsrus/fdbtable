<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Каркас страницы на div-блоках с float: совместимо со старыми браузерами -->
    <div class="page">
        <!-- Заголовок -->
        <div class="header">
            <span class="prompt">></span> <span class="title">fdbtable</span><span class="cursor">_</span>
            <span class="header-sub">FDB таблицы сетевых коммутаторов</span>
        </div>
        <div class="body">
            <!-- Левая колонка: список коммутаторов -->
            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">// КОММУТАТОРЫ</div>
                    <div class="sort-bar">
                        <button type="button" class="sort-btn active" data-sort="ip">По IP</button>
                        <button type="button" class="sort-btn" data-sort="name">По имени</button>
                    </div>
                    <ul id="sw-list" class="sw-list">
                        <li class="sw-empty">Загрузка...</li>
                    </ul>
                    <!-- Форма добавления (и редактирования) коммутатора -->
                    <form id="sw-form" class="sw-form" method="post" action="/api/swinfo/add">
                        <input type="text" name="ip" id="sw-ip" placeholder="IP-адрес" required>
                        <input type="text" name="hostname" id="sw-hostname" placeholder="Имя коммутатора">
                        <input type="text" name="mac" id="sw-mac" placeholder="MAC-адрес">
                        <input type="text" name="location" id="sw-location" placeholder="Местоположение">
                        <input type="text" name="description" id="sw-description" placeholder="Описание">
                        <input type="text" name="username" id="sw-username" placeholder="Имя пользователя">
                        <input type="password" name="password" id="sw-password" placeholder="Пароль">
                        <!-- Тип сбора — фиксированный список из коллекции model.CollectTypes.
                             Пользователь не может ввести произвольное значение. -->
                        <select name="collect_type" id="sw-collect-type">
                            {{ range .collectTypes }}
                            <option value="{{ . }}">{{ . }}</option>
                            {{ end }}
                        </select>
                        <div class="form-buttons">
                            <button type="submit" id="sw-submit">+ Добавить</button>
                            <button type="button" class="cancel-btn" id="sw-cancel">Отмена</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- Правая, большая колонка: порты выбранного коммутатора -->
            <div class="content">
                <div class="panel ports-panel">
                    <div class="panel-title" id="ports-title">// ПОРТЫ КОММУТАТОРА</div>
                    <!-- Общие сведения о коммутаторе, полученные при сборе -->
                    <div class="sw-info" id="sw-info" style="display:none;"></div>
                    <div class="ports-placeholder" id="ports-placeholder">Выберите коммутатор слева</div>
                    <table class="ports-table" id="ports-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>Индекс</th>
                                <th>Порт</th>
                                <th>Адм. статус</th>
                                <th>Статус</th>
                                <th>Скорость</th>
                                <th>Вх. поток</th>
                                <th>Исх. поток</th>
                                <th>Вх. ош.</th>
                                <th>Исх. ош.</th>
                                <th>Изм.</th>
                                <th>MAC</th>
                            </tr>
                        </thead>
                        <tbody id="ports-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Футер: копирайт и версия программы -->
        <div class="footer">
            <span>&copy; 2026 Sterlikov Kirill</span>
            <span class="footer-version">fdbtable {{ .version }}</span>
        </div>
    </div>

    <script>
    // Работа со списком коммутаторов и портами.
    // Без фреймворков: XMLHttpRequest, var, function — совместимо со старыми браузерами.
    (function () {
        'use strict';

        var swList = document.getElementById('sw-list');
        var swForm = document.getElementById('sw-form');
        var swIp = document.getElementById('sw-ip');
        var swHostname = document.getElementById('sw-hostname');
        var swMac = document.getElementById('sw-mac');
        var swLocation = document.getElementById('sw-location');
        var swDescription = document.getElementById('sw-description');
        var swUsername = document.getElementById('sw-username');
        var swPassword = document.getElementById('sw-password');
        var swCollectType = document.getElementById('sw-collect-type');
        var swSubmit = document.getElementById('sw-submit');
        var swCancel = document.getElementById('sw-cancel');
        var portsTitle = document.getElementById('ports-title');
        var portsPlaceholder = document.getElementById('ports-placeholder');
        var portsTable = document.getElementById('ports-table');
        var portsBody = document.getElementById('ports-body');
        var swInfo = document.getElementById('sw-info');
        var sortBtns = document.getElementsByClassName('sort-btn');

        var switches = [];
        var currentSort = 'ip';
        var selectedIp = null;

        // Экранирование HTML-спецсимволов.
        function escapeHtml(s) {
            if (s === null || s === undefined) { return ''; }
            return String(s)
                .replace(/&/g, '&')
                .replace(/</g, '<')
                .replace(/>/g, '>')
                .replace(/"/g, '"');
        }

        // Сериализация полей формы в строку application/x-www-form-urlencoded.
        function serializeForm(form) {
            var parts = [];
            var els = form.elements;
            for (var i = 0; i < els.length; i++) {
                var el = els[i];
                if (!el.name || el.disabled) { continue; }
                var type = (el.type || '').toLowerCase();
                if (type === 'submit' || type === 'button' || type === 'reset') { continue; }
                if ((type === 'checkbox' || type === 'radio') && !el.checked) { continue; }
                parts.push(encodeURIComponent(el.name) + '=' + encodeURIComponent(el.value));
            }
            return parts.join('&');
        }

        // Универсальный POST-запрос через XMLHttpRequest (работает в старых браузерах).
        // callback(ok, resp) — ok: успешен ли запрос, resp: разобранный JSON-ответ.
        function postForm(url, params, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) { return; }
                var resp = null;
                try {
                    resp = JSON.parse(xhr.responseText);
                } catch (err) {
                    resp = null;
                }
                var ok = (xhr.status >= 200 && xhr.status < 300) && resp && resp.ok;
                callback(ok, resp || {});
            };
            xhr.send(params);
        }

        // Загрузка списка коммутаторов с сервера.
        function loadSwitches() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/swinfo', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) { return; }
                if (xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    switches = resp.switches || [];
                    renderSwitches();
                } else {
                    swList.innerHTML = '<li class="sw-empty">Ошибка загрузки списка</li>';
                }
            };
            xhr.send();
        }

        // Сортировка списка коммутаторов.
        function sortSwitches() {
            switches.sort(function (a, b) {
                var ka = (currentSort === 'name') ? (a.hostname || '') : (a.ip || '');
                var kb = (currentSort === 'name') ? (b.hostname || '') : (b.ip || '');
                ka = ka.toLowerCase();
                kb = kb.toLowerCase();
                if (ka < kb) { return -1; }
                if (ka > kb) { return 1; }
                return 0;
            });
        }

        // Отрисовка списка коммутаторов.
        function renderSwitches() {
            sortSwitches();
            var html = '';
            for (var i = 0; i < switches.length; i++) {
                var sw = switches[i];
                var cls = (sw.ip === selectedIp) ? ' selected' : '';
                html += '<li class="sw-item' + cls + '" data-ip="' + escapeHtml(sw.ip) + '">'
                    + '<span class="sw-ip">' + escapeHtml(sw.ip) + '</span>'
                    + '<span class="sw-name">' + escapeHtml(sw.hostname || '') + '</span>'
                    + '<span class="sw-actions">'
                    + '<button type="button" class="sw-del" data-ip="' + escapeHtml(sw.ip) + '" title="Удалить">&#10005;</button>'
                    + '<a href="#" class="sw-edit" title="Изменить">&#9998;</a>'
                    + '<button type="button" class="sw-refresh" data-ip="' + escapeHtml(sw.ip) + '" title="Обновить информацию">&#8635;</button>'
                    + '</span>'
                    + '</li>';
            }
            if (switches.length === 0) {
                html = '<li class="sw-empty">Коммутаторы не найдены</li>';
            }
            swList.innerHTML = html;

            // Клик по элементу списка — выбор коммутатора.
            var items = swList.getElementsByTagName('li');
            for (var j = 0; j < items.length; j++) {
                items[j].onclick = (function (li) {
                    return function (e) {
                        var t = e.target || e.srcElement;
                        if (t.tagName === 'A' || t.tagName === 'BUTTON' || t.tagName === 'FORM' || t.tagName === 'INPUT') {
                            return;
                        }
                        selectSwitch(li.getAttribute('data-ip'));
                    };
                })(items[j]);
            }

            // Клик по значку "изменить".
            var edits = swList.getElementsByClassName('sw-edit');
            for (var k = 0; k < edits.length; k++) {
                edits[k].onclick = (function (a) {
                    return function (e) {
                        if (e.preventDefault) { e.preventDefault(); }
                        startEdit(a.parentNode.parentNode.getAttribute('data-ip'));
                    };
                })(edits[k]);
            }

            // Клик по кнопке "удалить" — AJAX-запрос на удаление.
            var dels = swList.getElementsByClassName('sw-del');
            for (var d = 0; d < dels.length; d++) {
                dels[d].onclick = (function (btn) {
                    return function (e) {
                        if (e.preventDefault) { e.preventDefault(); }
                        var ip = btn.getAttribute('data-ip');
                        if (!window.confirm('Удалить коммутатор ' + ip + '?')) { return; }
                        postForm('/api/swinfo/del', 'ip=' + encodeURIComponent(ip), function (ok, resp) {
                            if (ok) {
                                if (selectedIp === ip) { selectedIp = null; }
                                loadSwitches();
                            } else {
                                window.alert(resp.error || 'Ошибка удаления коммутатора');
                            }
                        });
                    };
                })(dels[d]);
            }

            // Клик по кнопке "обновить информацию" — запуск сбора данных с коммутатора.
            var refreshes = swList.getElementsByClassName('sw-refresh');
            for (var r = 0; r < refreshes.length; r++) {
                refreshes[r].onclick = (function (btn) {
                    return function (e) {
                        if (e.preventDefault) { e.preventDefault(); }
                        var ip = btn.getAttribute('data-ip');
                        postForm('/api/swinfo/collect', 'ip=' + encodeURIComponent(ip), function (ok, resp) {
                            if (ok) {
                                // После сбора перезагружаем порты выбранного коммутатора.
                                loadPorts(ip);
                            } else {
                                window.alert(resp.error || 'Ошибка запуска сбора данных о коммутаторе');
                            }
                        });
                    };
                })(refreshes[r]);
            }
        }

        // Выбор коммутатора и загрузка его портов.
        function selectSwitch(ip) {
            selectedIp = ip;
            renderSwitches();
            loadPorts(ip);
        }

        // Текстовые представления состояний порта по RFC 2863.
        // Значения соответствуют модели model.AdminState / model.OperState.
        var adminStates = { 1: 'up', 2: 'down', 3: 'testing' };
        var operStates = { 1: 'up', 2: 'down', 3: 'testing', 4: 'unknown',
            5: 'dormant', 6: 'notPresent', 7: 'lowerLayerDown' };

        // Количество MAC-адресов, выводимых в ячейке таблицы.
        // Остальные скрываются со счётчиком в конце списка.
        var visibleMacsCount = 4;

        // Текстовое представление состояния порта по числовому значению.
        // Неизвестные значения показываются как unknown.
        function stateText(states, v) {
            return states[v] || 'unknown';
        }

        // CSS-класс цвета для значения состояния: up — зелёным,
        // down — красным, остальные (unknown, testing и т.п.) — серым.
        function stateClass(s) {
            if (s === 'up') { return 'st-up'; }
            if (s === 'down') { return 'st-down'; }
            return 'st-unknown';
        }

        // Формирование ячейки с MAC-адресами: первые 4 адреса выводятся
        // столбиком, количество оставшихся скрытых добавляется счётчиком.
        function renderMacs(macs) {
            if (!macs || macs.length === 0) { return ''; }
            var shown = macs.slice(0, visibleMacsCount);
            var hidden = macs.length - shown.length;
            var html = '';
            for (var m = 0; m < shown.length; m++) {
                if (m > 0) { html += '<br>'; }
                html += escapeHtml(shown[m]["string_mac"]) + ' <small>' + escapeHtml(shown[m]["vendor"]) + '</small>';
            }
            if (hidden > 0) {
                html += '<br><span class="mac-more">+ ' + hidden + ' ещё</span>';
            }
            return html;
        }

        // Текстовое представление числа: пустые значения — пустой строкой,
        // нули выводятся как 0.
        function numText(v) {
            if (v === undefined || v === null || v === '') { return ''; }
            return String(v);
        }

        // Форматирование длительности из наносекунд в человекочитаемый вид:
        // "Nд ЧЧ:ММ:СС" (дни добавляются только если их больше нуля).
        function formatDuration(ns) {
            if (ns === undefined || ns === null || ns === '' || Number(ns) === 0) { return ''; }
            function pad(x) { return (x < 10) ? '0' + x : String(x); }
            var sec = Math.floor(Number(ns) / 1e9);
            var d = Math.floor(sec / 86400);
            sec -= d * 86400;
            var h = Math.floor(sec / 3600);
            sec -= h * 3600;
            var m = Math.floor(sec / 60);
            var s = sec - m * 60;
            var time = pad(h) + ':' + pad(m) + ':' + pad(s);
            return (d > 0) ? d + 'д ' + time : time;
        }

        // Русская форма слова в зависимости от числа:
        // pluralRu(1, 'день', 'дня', 'дней') -> 'день',
        // pluralRu(3, 'час', 'часа', 'часов') -> 'часа',
        // pluralRu(5, 'минута', 'минуты', 'минут') -> 'минут'.
        function pluralRu(n, one, few, many) {
            var n10 = n % 10;
            var n100 = n % 100;
            if (n10 === 1 && n100 !== 11) { return one; }
            if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) { return few; }
            return many;
        }

        // Форматирование интервала из наносекунд в вид
        // "3 дня 3 часа 1 минута назад".
        // Отрицательные или нулевые значения возвращают пустую строку.
        function formatAgo(ns) {
            if (ns === undefined || ns === null || ns === '' || Number(ns) <= 0) { return ''; }
            var sec = Math.floor(Number(ns) / 1e9);
            var d = Math.floor(sec / 86400);
            sec -= d * 86400;
            var h = Math.floor(sec / 3600);
            sec -= h * 3600;
            var m = Math.floor(sec / 60);
            var s = sec - m * 60;
            var parts = [];
            if (d > 0) { parts.push(d + ' ' + pluralRu(d, 'день', 'дня', 'дней')); }
            if (h > 0) { parts.push(h + ' ' + pluralRu(h, 'час', 'часа', 'часов')); }
            if (m > 0) { parts.push(m + ' ' + pluralRu(m, 'минута', 'минуты', 'минут')); }
            if (parts.length === 0 && s > 0) { parts.push(s + ' ' + pluralRu(s, 'секунда', 'секунды', 'секунд')); }
            if (parts.length === 0) { return ''; }
            return parts.join(' ') + ' назад';
        }

        // Форматирование даты и времени в формате "ДД.ММ.ГГГГ ЧЧ:ММ:СС".
        function formatTime(ts) {
            if (ts === undefined || ts === null || ts === '') { return ''; }
            function pad(x) { return (x < 10) ? '0' + x : String(x); }
            var d = new Date(ts);
            if (isNaN(d.getTime())) { return String(ts); }
            return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear()
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        // Форматирование скорости (бит/с) в человекочитаемый вид.
        function formatRate(bps) {
            if (bps === undefined || bps === null || bps === '') { return ''; }
            bps = Number(bps);
            if (bps >= 1e9) { return (bps / 1e9).toFixed(2) + ' Гбит/с'; }
            if (bps >= 1e6) { return (bps / 1e6).toFixed(2) + ' Мбит/с'; }
            if (bps >= 1e3) { return (bps / 1e3).toFixed(2) + ' Кбит/с'; }
            return bps + ' бит/с';
        }

        // Отрисовка общих сведений о коммутаторе компактной строкой над
        // таблицей портов. Пустые значения пропускаются.
        function renderSwInfo(sw) {
            var items = [
                ['IP', sw.ip],
                ['MAC', sw.mac],
                ['Имя', sw.hostname],
                ['Описание', sw.description],
                ['Местоположение', sw.location],
                ['Контакт', sw.contact],
                ['Производитель', sw.vendor],
                ['Модель', sw.model],
                ['ПО', sw.software_version],
                ['Uptime', formatDuration(sw.uptime)],
                ['Сбор', formatTime(sw.collected_at)]
            ];
            var html = '';
            for (var i = 0; i < items.length; i++) {
                var val = items[i][1];
                if (val === undefined || val === null || val === '') { continue; }
                html += '<span class="sw-info-item"><span class="sw-info-label">'
                    + escapeHtml(items[i][0]) + ':</span> ' + escapeHtml(val) + '</span>';
            }
            swInfo.style.display = html ? 'block' : 'none';
            swInfo.innerHTML = html;
        }

        // Загрузка данных выбранного коммутатора.
        function loadPorts(ip) {
            portsTitle.innerHTML = '// ПОРТЫ КОММУТАТОРА: ' + escapeHtml(ip);
            portsPlaceholder.style.display = 'block';
            portsPlaceholder.innerHTML = 'Загрузка портов...';
            portsTable.style.display = 'none';
            swInfo.style.display = 'none';

            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/swdata?ip=' + encodeURIComponent(ip), true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) { return; }
                if (xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    var swData = resp.switch || {};
                    renderSwInfo(swData);
                    // uptime передаётся в renderPorts для вычисления
                    // возраста последнего изменения порта (uptime - last_change).
                    renderPorts(swData.ports || [], swData.uptime);
                } else {
                    swInfo.style.display = 'none';
                    portsPlaceholder.style.display = 'block';
                    portsPlaceholder.innerHTML = 'Данные о коммутаторе не найдены. Запустите сбор информации.';
                }
            };
            xhr.send();
        }

        // Отрисовка таблицы портов. uptime — время работы коммутатора
        // (используется для вычисления возраста последнего изменения порта).
        function renderPorts(ports, uptime) {
            portsPlaceholder.style.display = 'none';
            portsTable.style.display = 'table';
            var html = '';
            for (var i = 0; i < ports.length; i++) {
                var p = ports[i];
                var admin = stateText(adminStates, p.admin_state);
                var oper = stateText(operStates, p.oper_state);
                // Возраст изменения: сколько времени назад порт сменил состояние.
                // last_change — момент изменения относительно времени работы
                // коммутатора, поэтому вычитаем его из uptime.
                var ago = '';
                if (uptime != 0 && p.last_change != 0) {
                    ago = formatAgo(uptime - p.last_change);
                }
                html += '<tr>'
                    + '<td>' + escapeHtml(numText(p.index)) + '</td>'
                    + '<td>' + escapeHtml(p.name || '') + '</td>'
                    + '<td class="' + stateClass(admin) + '">' + escapeHtml(admin) + '</td>'
                    + '<td class="' + stateClass(oper) + '">' + escapeHtml(oper) + '</td>'
                    + '<td>' + escapeHtml(numText(p.speed)) + '</td>'
                    + '<td>' + escapeHtml(formatRate(p.in_rate)) + '</td>'
                    + '<td>' + escapeHtml(formatRate(p.out_rate)) + '</td>'
                    + '<td>' + escapeHtml(numText(p.in_errors)) + '</td>'
                    + '<td>' + escapeHtml(numText(p.out_errors)) + '</td>'
                    + '<td>'
                    + escapeHtml(formatDuration(p.last_change))
                    + (ago ? '<br><span class="change-ago">' + escapeHtml(ago) + '</span>' : '')
                    + '</td>'
                    + '<td class="ports-macs">' + renderMacs(p.macs) + '</td>'
                    + '</tr>';
            }
            if (ports.length === 0) {
                html = '<tr><td colspan="11">Порты не найдены</td></tr>';
            }
            portsBody.innerHTML = html;
        }

        // Редактирование коммутатора: заполняем форму данными и меняем action.
        function startEdit(ip) {
            for (var i = 0; i < switches.length; i++) {
                if (switches[i].ip === ip) {
                    var sw = switches[i];
                    swIp.value = sw.ip;
                    swHostname.value = sw.hostname || '';
                    swMac.value = sw.mac || '';
                    swLocation.value = sw.location || '';
                    swDescription.value = sw.description || '';
                    swUsername.value = sw.username || '';
                    swPassword.value = sw.password || '';
                    // Для select установка value выбирает совпадающий вариант.
                    // Если сохранённый тип отсутствует в списке, остаётся первый вариант.
                    swCollectType.value = sw.collect_type || '';
                    swForm.action = '/api/swinfo/set';
                    swSubmit.innerHTML = 'Сохранить';
                    swCancel.style.display = 'block';
                    break;
                }
            }
        }

        // Отмена редактирования — возврат к режиму добавления.
        function cancelEdit() {
            swForm.reset();
            swForm.action = '/api/swinfo/add';
            swSubmit.innerHTML = '+ Добавить';
            swCancel.style.display = 'none';
        }

        // Кнопки сортировки.
        for (var s = 0; s < sortBtns.length; s++) {
            sortBtns[s].onclick = (function (btn) {
                return function () {
                    currentSort = btn.getAttribute('data-sort');
                    for (var t = 0; t < sortBtns.length; t++) {
                        sortBtns[t].className = 'sort-btn';
                    }
                    btn.className = 'sort-btn active';
                    renderSwitches();
                };
            })(sortBtns[s]);
        }

        swCancel.onclick = cancelEdit;

        // Отправка формы добавления/редактирования через AJAX вместо перехода на страницу.
        swForm.onsubmit = function (e) {
            if (e.preventDefault) { e.preventDefault(); }
            var url = swForm.getAttribute('action') || '/api/swinfo/add';
            var params = serializeForm(swForm);
            postForm(url, params, function (ok, resp) {
                if (ok) {
                    cancelEdit();
                    loadSwitches();
                } else {
                    window.alert(resp.error || 'Ошибка сохранения коммутатора');
                }
            });
            return false;
        };

        // Загрузка списка коммутаторов при открытии страницы.
        loadSwitches();
    })();
    </script>
</body>
</html>
