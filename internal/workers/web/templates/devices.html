<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .title }}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- Каркас страницы на div-блоках с float: совместимо со старыми браузерами -->
    <div class="page">
        <!-- Заголовок -->
        <div class="header">
            <span class="prompt">></span> <span class="title">fdbtable</span><span class="cursor">_</span>
            <span class="header-sub">FDB таблицы сетевых коммутаторов</span>
            <!-- Меню перехода между страницами интерфейса -->
            <nav class="header-nav">
                <a href="/" class="nav-link">Коммутаторы</a>
                <a href="/devices" class="nav-link active">Устройства</a>
            </nav>
        </div>
        <div class="body">
            <!-- Левая колонка: только форма добавления (и редактирования) устройства -->
            <div class="sidebar">
                <div class="panel">
                    <div class="panel-title">// ДОБАВИТЬ УСТРОЙСТВА</div>
                    <form id="dev-form" class="sw-form" method="post" action="/api/devices/add">
                        <input type="text" name="ip" id="dev-ip" placeholder="IP-адрес">
                        <input type="text" name="hostname" id="dev-hostname" placeholder="Имя устройства" required>
                        <input type="text" name="mac" id="dev-mac" placeholder="MAC-адрес" required>
                        <input type="text" name="location" id="dev-location" placeholder="Местоположение">
                        <input type="text" name="description" id="dev-description" placeholder="Описание">
                        <input type="text" name="type" id="dev-type" placeholder="Тип устройства" required>
                        <!-- Радиокнопки уже существующих в базе типов устройств.
                             Пользователь либо вводит новый тип в поле dev-type,
                             либо выбирает один из имеющихся — выбранное значение
                             подставляется в поле типа. Список типов загружается
                             скриптом через GET /api/devices/types. -->
                        <div class="dev-types" id="dev-types"></div>
                        <div class="form-buttons">
                            <button type="submit" id="dev-submit">+ Добавить</button>
                            <button type="button" class="cancel-btn" id="dev-cancel">Отмена</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- Правая, большая колонка: таблица устройств из базы данных -->
            <div class="content">
                <div class="panel ports-panel">
                    <div class="panel-title">// УСТРОЙСТВА В БАЗЕ</div>
                    <!-- Фильтр по типам устройств: чекбоксы, можно выбрать несколько типов.
                         Список типов строится скриптом из загруженных устройств. -->
                    <div class="dev-filters" id="dev-filters">
                        <div class="dev-filters-title">Фильтр по типу:</div>
                        <div class="dev-filters-options" id="dev-filter-options"></div>
                    </div>
                    <div class="ports-placeholder" id="dev-placeholder">Загрузка...</div>
                    <table class="dev-table" id="dev-table" style="display:none;">
                        <thead>
                            <tr>
                                <th class="sortable" data-sort="ip">IP <span class="sort-indicator"></span></th>
                                <th class="sortable" data-sort="hostname">Имя <span class="sort-indicator"></span></th>
                                <th class="sortable" data-sort="mac">MAC <span class="sort-indicator"></span></th>
                                <th class="sortable" data-sort="type">Тип <span class="sort-indicator"></span></th>
                                <th class="sortable" data-sort="location">Местоположение <span class="sort-indicator"></span></th>
                                <th class="sortable" data-sort="description">Описание <span class="sort-indicator"></span></th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="dev-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Футер: копирайт и версия программы -->
        <div class="footer">
            <span>&copy; 2026 Sterlikov Kirill</span>
            <span class="footer-version">fdbtable {{ .version }}</span>
        </div>
    </div>

    <script>
    // Работа с устройствами: добавление/редактирование в левой панели,
    // вывод списка из базы данных — таблицей в правой панели.
    // Без фреймворков: XMLHttpRequest, var, function — совместимо со старыми браузерами.
    (function () {
        'use strict';

        var devForm = document.getElementById('dev-form');
        var devIp = document.getElementById('dev-ip');
        var devHostname = document.getElementById('dev-hostname');
        var devMac = document.getElementById('dev-mac');
        var devType = document.getElementById('dev-type');
        var devLocation = document.getElementById('dev-location');
        var devDescription = document.getElementById('dev-description');
        var devSubmit = document.getElementById('dev-submit');
        var devCancel = document.getElementById('dev-cancel');
        var devTable = document.getElementById('dev-table');
        var devBody = document.getElementById('dev-body');
        var devPlaceholder = document.getElementById('dev-placeholder');
        var devTypesBox = document.getElementById('dev-types');
        var devFilterOptions = document.getElementById('dev-filter-options');

        var devices = [];

        // Состояние сортировки таблицы: поле и направление ('asc'/'desc').
        var sortField = '';
        var sortDir = 'asc';
        // Выбранные в фильтре типы устройств (пустой список = показать все).
        var selectedTypes = [];

        // Экранирование HTML-спецсимволов.
        function escapeHtml(s) {
            if (s === null || s === undefined) { return ''; }
            return String(s)
                .replace(/&/g, '&')
                .replace(/</g, '<')
                .replace(/>/g, '>')
                .replace(/"/g, '"');
        }

        // Сериализация полей формы в строку application/x-www-form-urlencoded.
        function serializeForm(form) {
            var parts = [];
            var els = form.elements;
            for (var i = 0; i < els.length; i++) {
                var el = els[i];
                if (!el.name || el.disabled) { continue; }
                var type = (el.type || '').toLowerCase();
                if (type === 'submit' || type === 'button' || type === 'reset') { continue; }
                if ((type === 'checkbox' || type === 'radio') && !el.checked) { continue; }
                // Радиокнопки выбора типа — только вспомогательный элемент управления:
                // значение уже передаётся через поле dev-type, поэтому не отправляем его.
                if (el.name === 'dev-type-radio') { continue; }
                parts.push(encodeURIComponent(el.name) + '=' + encodeURIComponent(el.value));
            }
            return parts.join('&');
        }

        // Универсальный POST-запрос через XMLHttpRequest (работает в старых браузерах).
        // callback(ok, resp) — ok: успешен ли запрос, resp: разобранный JSON-ответ.
        function postForm(url, params, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', url, true);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) { return; }
                var resp = null;
                try {
                    resp = JSON.parse(xhr.responseText);
                } catch (err) {
                    resp = null;
                }
                var ok = (xhr.status >= 200 && xhr.status < 300) && resp && resp.ok;
                callback(ok, resp || {});
            };
            xhr.send(params);
        }

        // Загрузка списка уникальных типов устройств с сервера.
        // Типы используются для радиокнопок под полем "Тип устройства".
        function loadDeviceTypes() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/devices/types', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) { return; }
                if (xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    renderDeviceTypes(resp.types || []);
                }
            };
            xhr.send();
        }

        // Отрисовка радиокнопок существующих типов устройств.
        // По умолчанию ни одна радиокнопка не выбрана.
        function renderDeviceTypes(types) {
            var html = '<div class="dev-types-title">Выберите существующий тип:</div>';
            for (var i = 0; i < types.length; i++) {
                var t = types[i];
                html += '<label class="dev-type-option">'
                    // Общий name объединяет радиокнопки в одну группу:
                    // при выборе одной предыдущие автоматически сбрасываются.
                    + '<input type="radio" name="dev-type-radio" class="dev-type-radio" value="' + escapeHtml(t) + '"> '
                    + escapeHtml(t)
                    + '</label>';
            }
            devTypesBox.innerHTML = html;

            // Выбор радиокнопки подставляет выбранное значение в поле типа.
            var radios = devTypesBox.getElementsByClassName('dev-type-radio');
            for (var r = 0; r < radios.length; r++) {
                radios[r].onclick = (function (radio) {
                    return function () {
                        devType.value = radio.value;
                    };
                })(radios[r]);
            }

            // Приводим выбор радиокнопок в соответствие с полем типа.
            syncDevTypeRadio();
        }

        // Синхронизация радиокнопок с текущим значением поля "Тип устройства":
        // если поле содержит один из существующих типов — соответствующая
        // радиокнопка помечается выбранной, иначе выбор снимается.
        function syncDevTypeRadio() {
            var radios = devTypesBox.getElementsByClassName('dev-type-radio');
            var value = devType.value;
            for (var r = 0; r < radios.length; r++) {
                radios[r].checked = (radios[r].value === value);
            }
        }

        // Ручной ввод в поле "Тип устройства" означает создание нового типа:
        // выбор радиокнопки при этом снимается.
        devType.oninput = syncDevTypeRadio;

        // Загрузка списка устройств с сервера.
        function loadDevices() {
            devPlaceholder.style.display = 'block';
            devPlaceholder.innerHTML = 'Загрузка...';
            devTable.style.display = 'none';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/devices', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) { return; }
                if (xhr.status === 200) {
                    var resp = JSON.parse(xhr.responseText);
                    devices = resp.devices || [];
                    // Пересобираем чекбоксы фильтра по типам (выбор сохраняется).
                    renderTypeFilters();
                    renderDevices();
                } else {
                    devPlaceholder.style.display = 'block';
                    devPlaceholder.innerHTML = 'Ошибка загрузки списка';
                }
            };
            xhr.send();
        }

        // Сравнение двух значений для сортировки:
        // числа — численно, IP-адреса — по октетам, остальное — как строки.
        function compareValues(a, b) {
            var aStr = String(a === null || a === undefined ? '' : a);
            var bStr = String(b === null || b === undefined ? '' : b);
            if (aStr !== '' && bStr !== '' && !isNaN(aStr) && !isNaN(bStr)) {
                var an = parseFloat(aStr);
                var bn = parseFloat(bStr);
                if (an < bn) { return -1; }
                if (an > bn) { return 1; }
                return 0;
            }
            var aOct = aStr.split('.');
            var bOct = bStr.split('.');
            if (aOct.length === 4 && bOct.length === 4) {
                for (var o = 0; o < 4; o++) {
                    var ao = parseInt(aOct[o], 10);
                    var bo = parseInt(bOct[o], 10);
                    if (ao < bo) { return -1; }
                    if (ao > bo) { return 1; }
                }
                return 0;
            }
            var al = aStr.toLowerCase();
            var bl = bStr.toLowerCase();
            if (al < bl) { return -1; }
            if (al > bl) { return 1; }
            return 0;
        }

        // Список устройств с учётом фильтра по типам и текущей сортировки.
        function getVisibleDevices() {
            var list = [];
            for (var i = 0; i < devices.length; i++) {
                var dev = devices[i];
                // Если выбраны типы — устройства других типов пропускаем.
                if (selectedTypes.length > 0 && selectedTypes.indexOf(dev.type || '') < 0) { continue; }
                list.push(dev);
            }
            if (sortField) {
                list.sort(function (a, b) {
                    var r = compareValues(a[sortField], b[sortField]);
                    return (sortDir === 'asc') ? r : -r;
                });
            }
            return list;
        }

        // Отрисовка чекбоксов фильтра по типам устройств.
        // Список типов строится из загруженных устройств; выбор сохраняется,
        // если тип по-прежнему присутствует в базе.
        function renderTypeFilters() {
            var types = [];
            for (var i = 0; i < devices.length; i++) {
                var t = devices[i].type || '';
                if (t !== '' && types.indexOf(t) < 0) { types.push(t); }
            }
            types.sort();
            // Оставляем в выборе только типы, которые ещё есть в списке.
            var keep = [];
            for (var s = 0; s < selectedTypes.length; s++) {
                if (types.indexOf(selectedTypes[s]) >= 0) { keep.push(selectedTypes[s]); }
            }
            selectedTypes = keep;
            var html = '';
            for (var k = 0; k < types.length; k++) {
                var checked = (selectedTypes.indexOf(types[k]) >= 0) ? ' checked' : '';
                html += '<label class="dev-filter-option">'
                    + '<input type="checkbox" class="dev-filter-check" value="' + escapeHtml(types[k]) + '"' + checked + '> '
                    + escapeHtml(types[k])
                    + '</label>';
            }
            devFilterOptions.innerHTML = html;
            // Клик по чекбоксу — обновляем выбор и перерисовываем таблицу.
            var checks = devFilterOptions.getElementsByClassName('dev-filter-check');
            for (var c = 0; c < checks.length; c++) {
                checks[c].onclick = (function (chk) {
                    return function () {
                        var t = chk.value;
                        var idx = selectedTypes.indexOf(t);
                        if (chk.checked && idx < 0) {
                            selectedTypes.push(t);
                        } else if (!chk.checked && idx >= 0) {
                            selectedTypes.splice(idx, 1);
                        }
                        renderDevices();
                    };
                })(checks[c]);
            }
        }

        // Обновление стрелок сортировки в заголовках таблицы.
        function updateSortIndicators() {
            var heads = devTable.getElementsByTagName('th');
            for (var i = 0; i < heads.length; i++) {
                var th = heads[i];
                var ind = th.getElementsByClassName('sort-indicator')[0];
                if (!ind) { continue; }
                if (th.getAttribute('data-sort') === sortField) {
                    ind.innerHTML = (sortDir === 'asc') ? ' &#9650;' : ' &#9660;';
                } else {
                    ind.innerHTML = '';
                }
            }
        }

        // Отрисовка таблицы устройств в правой панели.
        function renderDevices() {
            var list = getVisibleDevices();
            var html = '';
            for (var i = 0; i < list.length; i++) {
                var dev = list[i];
                html += '<tr>'
                    + '<td>' + escapeHtml(dev.ip || '') + '</td>'
                    + '<td>' + escapeHtml(dev.hostname || '') + '</td>'
                    + '<td>' + escapeHtml(dev.mac || '') + '</td>'
                    + '<td>' + escapeHtml(dev.type || '') + '</td>'
                    + '<td>' + escapeHtml(dev.location || '') + '</td>'
                    + '<td>' + escapeHtml(dev.description || '') + '</td>'
                    + '<td class="dev-actions">'
                    + '<a href="#" class="sw-edit" data-mac="' + escapeHtml(dev.mac) + '" title="Изменить">&#9998;</a>'
                    + '<button type="button" class="sw-del" data-mac="' + escapeHtml(dev.mac) + '" title="Удалить">&#10005;</button>'
                    + '</td>'
                    + '</tr>';
            }
            if (list.length === 0) {
                html = '<tr><td colspan="7">Устройства не найдены</td></tr>';
            }
            devBody.innerHTML = html;
            devPlaceholder.style.display = 'none';
            devTable.style.display = 'table';
            updateSortIndicators();

            // Клик по значку "изменить".
            var edits = devBody.getElementsByClassName('sw-edit');
            for (var k = 0; k < edits.length; k++) {
                edits[k].onclick = (function (a) {
                    return function (e) {
                        if (e.preventDefault) { e.preventDefault(); }
                        startEdit(a.getAttribute('data-mac'));
                    };
                })(edits[k]);
            }

            // Клик по кнопке "удалить" — AJAX-запрос на удаление.
            var dels = devBody.getElementsByClassName('sw-del');
            for (var d = 0; d < dels.length; d++) {
                dels[d].onclick = (function (btn) {
                    return function (e) {
                        if (e.preventDefault) { e.preventDefault(); }
                        var mac = btn.getAttribute('data-mac');
                        if (!window.confirm('Удалить устройство ' + mac + '?')) { return; }
                        postForm('/api/devices/del', 'mac=' + encodeURIComponent(mac), function (ok, resp) {
                            if (ok) {
                                loadDevices();
                            } else {
                                window.alert(resp.error || 'Ошибка удаления устройства');
                            }
                        });
                    };
                })(dels[d]);
            }
        }

        // Редактирование устройства: заполняем форму данными и меняем action.
        // Ключ записи устройства — MAC-адрес, поэтому его тоже подставляем в форму.
        function startEdit(mac) {
            for (var i = 0; i < devices.length; i++) {
                if (devices[i].mac === mac) {
                    var dev = devices[i];
                    devIp.value = dev.ip || '';
                    devHostname.value = dev.hostname || '';
                    devMac.value = dev.mac || '';
                    devType.value = dev.type || '';
                    devLocation.value = dev.location || '';
                    devDescription.value = dev.description || '';
                    devForm.action = '/api/devices/set';
                    devSubmit.innerHTML = 'Сохранить';
                    devCancel.style.display = 'block';
                    // Отмечаем радиокнопку, если тип устройства уже существует.
                    syncDevTypeRadio();
                    break;
                }
            }
        }

        // Отмена редактирования — возврат к режиму добавления.
        function cancelEdit() {
            devForm.reset();
            devForm.action = '/api/devices/add';
            devSubmit.innerHTML = '+ Добавить';
            devCancel.style.display = 'none';
            // После сброса формы ни радиокнопка, ни поле типа не выбраны.
            syncDevTypeRadio();
        }

        devCancel.onclick = cancelEdit;

        // Отправка формы добавления/редактирования через AJAX вместо перехода на страницу.
        devForm.onsubmit = function (e) {
            if (e.preventDefault) { e.preventDefault(); }
            var url = devForm.getAttribute('action') || '/api/devices/add';
            var params = serializeForm(devForm);
            postForm(url, params, function (ok, resp) {
                if (ok) {
                    cancelEdit();
                    loadDevices();
                    // После добавления/изменения устройства перечитываем
                    // список типов — в базе мог появиться новый тип.
                    loadDeviceTypes();
                } else {
                    window.alert(resp.error || 'Ошибка сохранения устройства');
                }
            });
            return false;
        };

        // Клик по заголовку столбца — сортировка по этому столбцу.
        // Повторный клик по тому же столбцу переключает направление.
        var heads = devTable.getElementsByTagName('th');
        for (var h = 0; h < heads.length; h++) {
            heads[h].onclick = (function (th) {
                return function () {
                    var field = th.getAttribute('data-sort');
                    if (!field) { return; }
                    if (field === sortField) {
                        sortDir = (sortDir === 'asc') ? 'desc' : 'asc';
                    } else {
                        sortField = field;
                        sortDir = 'asc';
                    }
                    renderDevices();
                };
            })(heads[h]);
        }

        // Загрузка списков устройств и их типов при открытии страницы.
        loadDevices();
        loadDeviceTypes();
    })();
    </script>
</body>
</html>
